spec_version: 1
name: protein-lab
description: >-
  Structural-biology agent that takes a protein sequence through structure
  prediction, confidence reporting, rendering, and a rotating movie. Uses
  Boltz for live predictions and keeps an RCSB-backed demo fallback.

instructions: AGENTS.md

executor:
  type: omnigent
  config:
    harness: claude-sdk

interaction:
  conversational: true
  modalities:
    input: [text, file]
    output: [text]

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: auto
    write_paths:
      - .
      - ../../outputs
      - ../../.cache
      - ../../data
    allow_network: true

# Custom Python tools are packaged under tools/python and auto-discovered by
# Omnigent. The wrappers delegate to the reusable implementation in the repo's
# top-level tools/protein_tools.py.

params:
  default_target: glp1
  default_engine: auto
