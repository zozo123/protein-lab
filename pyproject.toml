[project]
name = "protein-folding-fun"
version = "0.1.0"
description = "Omnigent demo: protein structure prediction (Boltz) and 3D visualization"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "biopython>=1.81",
  "pillow>=10.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
boltz = ["boltz>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
protein-demo = "demo.run_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools", "demo"]
